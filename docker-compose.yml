name: ovl-node

# Development stack for the ovl-node monorepo.
# Usage:
#   docker compose up -d       — starts all services
#   docker compose down        — stops all services

services:
  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:latest
    restart: unless-stopped
    ports:
      - "3567:3567"
    environment:
      # Hardcoded to host.docker.internal so the container can reach Postgres running on the Mac host
      POSTGRESQL_CONNECTION_URI: "postgresql://ovl:ovl@host.docker.internal:5432/ovl_office"
    healthcheck:
      test: >
        bash -c 'exec 3<>/dev/tcp/127.0.0.1/3567 && echo -e "GET /hello HTTP/1.1\r\nhost: 127.0.0.1:3567\r\nConnection: close\r\n\r\n" >&3 && cat <&3 | grep "Hello"'
      interval: 10s
      timeout: 5s
      retries: 5

  api-office:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev --workspace=api-office
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      # The legacy shared-schema connection. Still a role with access to
      # `public`, because DATABASE_CONNECTION and everything built on it has not
      # migrated to per-tenant schemas yet.
      - DATABASE_URL=postgresql://ovl:ovl@host.docker.internal:5432/ovl_office
      # The tenant pool, and deliberately a different, lower-privilege role.
      # ovl_api is NOINHERIT and has no access to `public`: it can reach a
      # tenant schema only by assuming that tenant's role for one transaction.
      # Pointing this at the superuser above would appear to work while
      # silently removing the isolation guarantee, since superusers bypass
      # privilege checks entirely.
      - TENANCY_DATABASE_URL=postgresql://ovl_api:${OVL_API_DB_PASSWORD}@host.docker.internal:5432/ovl_office
      # Provisioning rights (CREATE SCHEMA / CREATE ROLE / GRANT). Present here
      # for local development convenience; a production API should leave this
      # unset so provisioning is disabled in the serving process.
      - ADMIN_DATABASE_URL=postgresql://ovl_admin:${OVL_ADMIN_DB_PASSWORD}@host.docker.internal:5432/ovl_office
      - MULTI_TENANCY_ENABLED=true
      - SUPERTOKENS_CONNECTION_URI=http://supertokens:3567
      - PORT=3001
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api-office/node_modules
      - /app/apps/api-vessel/node_modules
      - /app/apps/web-office/node_modules
      - /app/apps/web-vessel/node_modules
      - /app/packages/database/node_modules
      - /app/packages/vessel-database/node_modules
    depends_on:
      supertokens:
        condition: service_healthy

  api-vessel:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev --workspace=api-vessel
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      - DATABASE_URL=postgresql://ovl:ovl@host.docker.internal:5432/ovl_office
      - PORT=3003
      - OFFICE_API_URL=http://api-office:3001/trpc
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api-office/node_modules
      - /app/apps/api-vessel/node_modules
      - /app/apps/web-office/node_modules
      - /app/apps/web-vessel/node_modules
      - /app/packages/database/node_modules
      - /app/packages/vessel-database/node_modules

  web-office:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev --workspace=web-office
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api-office/node_modules
      - /app/apps/api-vessel/node_modules
      - /app/apps/web-office/node_modules
      - /app/apps/web-vessel/node_modules
      - /app/packages/database/node_modules
      - /app/packages/vessel-database/node_modules

  web-vessel:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev --workspace=web-vessel
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api-office/node_modules
      - /app/apps/api-vessel/node_modules
      - /app/apps/web-office/node_modules
      - /app/apps/web-vessel/node_modules
      - /app/packages/database/node_modules
      - /app/packages/vessel-database/node_modules
