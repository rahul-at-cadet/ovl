name: sparks

# A self-contained SPARKS stack, in the shape a real deployment has: each app
# behind one public origin, with nginx routing by path. That matters more than
# it sounds — the production web bundles call /auth, /trpc and /users/me on
# their *own* origin, so without the proxy in front the browser asks the Next
# server for API routes it does not have, and nothing works.
#
# Images are named `sparks-*` so they are obvious in `docker images` and cannot
# be confused with the `ovl-node-*` and `ovl-multivessel-*` images from the
# older stacks.
#
#   Office app   http://localhost:3100
#   Vessel app   http://localhost:3102
#
# Ports are deliberately away from 3000-3003/3567, which the development
# compose and the older stacks already use, so this can run beside them.
#
# Postgres and SuperTokens are expected on the host — this stack brings up the
# applications, not the data plane it shares with everything else. Override
# with the SPARKS_* variables below.
#
# Usage:
#   docker compose -f docker-compose.sparks.yml up -d --build
#   docker compose -f docker-compose.sparks.yml down
#
# One wrinkle worth knowing: nginx resolves its upstreams once, at startup. If
# you rebuild an app container it comes back on a new address and the proxy
# keeps sending traffic to the old one — 502 from a stack whose containers all
# report healthy. Restart the proxy after recreating an app:
#
#   docker compose -f docker-compose.sparks.yml restart office vessel

services:
  api-office:
    build:
      context: .
      dockerfile: apps/api-office/Dockerfile
    image: sparks-api-office:test
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # The legacy shared-schema pool, still a role with access to `public`.
      - DATABASE_URL=postgresql://${SPARKS_SUPERUSER:-ovl}:${SPARKS_SUPERUSER_PASSWORD:-ovl}@host.docker.internal:${SPARKS_PG_PORT:-55432}/${SPARKS_PG_DB:-ovl_office}
      # The tenant pool, and deliberately a lower-privilege role. Pointing this
      # at the superuser above would appear to work while silently removing the
      # isolation guarantee, because superusers bypass privilege checks.
      - TENANCY_DATABASE_URL=postgresql://ovl_api:${OVL_API_DB_PASSWORD}@host.docker.internal:${SPARKS_PG_PORT:-55432}/${SPARKS_PG_DB:-ovl_office}
      - ADMIN_DATABASE_URL=postgresql://ovl_admin:${OVL_ADMIN_DB_PASSWORD}@host.docker.internal:${SPARKS_PG_PORT:-55432}/${SPARKS_PG_DB:-ovl_office}
      - MULTI_TENANCY_ENABLED=true
      - SUPERTOKENS_CONNECTION_URI=http://host.docker.internal:${SPARKS_SUPERTOKENS_PORT:-3577}
      # One public origin, so these are the proxy's address rather than the
      # container's — SuperTokens uses them to scope its cookies.
      - API_DOMAIN=http://localhost:3100
      - WEBSITE_DOMAIN=http://localhost:3100
      - PORT=3001

  web-office:
    build:
      context: .
      dockerfile: apps/web-office/Dockerfile
    image: sparks-web-office:test
    restart: unless-stopped
    environment:
      - PORT=3000

  office:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "3100:80"
    volumes:
      - ./deploy/sparks/office.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-office
      - web-office

  api-vessel:
    build:
      context: .
      dockerfile: apps/api-vessel/Dockerfile
    image: sparks-api-vessel:test
    restart: unless-stopped
    environment:
      - PORT=3003
      - OFFICE_API_URL=http://api-office:3001/trpc
      # Absolute path so the named volume mounts at /data rather than over the
      # app's own WORKDIR, which holds dist/, schemas/ and node_modules.
      - LOCAL_DB_PATH=/data/vessel.sqlite
    volumes:
      - sparks-vessel-db:/data

  web-vessel:
    build:
      context: .
      dockerfile: apps/web-vessel/Dockerfile
    image: sparks-web-vessel:test
    restart: unless-stopped
    environment:
      - PORT=3002

  vessel:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "3102:80"
    volumes:
      - ./deploy/sparks/vessel.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-vessel
      - web-vessel

volumes:
  sparks-vessel-db:
