name: ovl-node-azure

# Deployment stack for the ovl-node monorepo, alongside the existing Go
# executables (ovl-office on :8080, ovl-vessel on :8420 via systemd —
# see ovl/deploy/azure/{office,vessel}.service) on the same Ubuntu VM.
# Runs on 3000-3003/3567 so it never collides with the Go services'
# ports; point nginx at these once you're ready to cut over.
#
# Builds the optimized, size-reduced production Dockerfiles under
# apps/*/Dockerfile (multi-stage, dependency-scoped, Alpine where the
# native modules involved allow it — see each Dockerfile's own
# comments), pointed at the VM's own native Postgres
# (ovl/deploy/office/docker-compose.yml's same ovl_office database, per
# ovl/deploy/azure/office.service's DSN) instead of a container.
# Credentials come from .env.azure (gitignored — never commit real
# secrets); see .env.azure.example for the shape.
#
# Usage on the VM:
#   docker compose -f docker-compose.azure.yml --env-file .env.azure up -d --build

services:
  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:latest
    restart: unless-stopped
    ports:
      - "3567:3567"

    environment:
      POSTGRESQL_CONNECTION_URI: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@host.docker.internal:5432/${POSTGRES_DB}?sslmode=disable"
    healthcheck:
      test: >
        bash -c 'exec 3<>/dev/tcp/127.0.0.1/3567 && echo -e "GET /hello HTTP/1.1\r\nhost: 127.0.0.1:3567\r\nConnection: close\r\n\r\n" >&3 && cat <&3 | grep "Hello"'
      interval: 10s
      timeout: 5s
      retries: 5

  api-office:
    image: api-office-void:latest
    container_name: api-office-void
    build:
      context: .
      dockerfile: apps/api-office/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"

    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@host.docker.internal:5432/${POSTGRES_DB}?sslmode=disable
      - SUPERTOKENS_CONNECTION_URI=http://supertokens:3567
      - PORT=3001
    depends_on:
      supertokens:
        condition: service_healthy

  api-vessel:
    image: api-vessel-void:latest
    container_name: api-vessel-void
    build:
      context: .
      dockerfile: apps/api-vessel/Dockerfile
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - OFFICE_API_URL=http://api-office:3001/trpc
      # Absolute path so the named volume below can be mounted at
      # /data instead of over the app's own WORKDIR (which holds
      # dist/, schemas/, and node_modules — a volume mounted there
      # would hide all of it behind an empty mountpoint).
      - LOCAL_DB_PATH=/data/vessel.sqlite
    volumes:
      - vessel-db-data:/data

  web-office:
    image: web-office-void:latest
    container_name: web-office-void
    build:
      context: .
      dockerfile: apps/web-office/Dockerfile
      args:
        # Empty by default, and that is the correct default: these are
        # baked into the client bundle at build time, so an absolute
        # http://localhost:3001 sends every remote visitor's own browser
        # looking at their own machine. Empty means relative URLs, which
        # is what the nginx single-origin routing above expects. Only set
        # these when the API really is on a different public origin.
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
        - NEXT_PUBLIC_WEBSITE_DOMAIN=${NEXT_PUBLIC_WEBSITE_DOMAIN:-}
    restart: unless-stopped
    ports:
      - "3000:3000"

  web-vessel:
    image: web-vessel-void:latest
    container_name: web-vessel-void
    build:
      context: .
      dockerfile: apps/web-vessel/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_VESSEL_API_URL:-}
        - NEXT_PUBLIC_WEBSITE_DOMAIN=${NEXT_PUBLIC_VESSEL_WEBSITE_DOMAIN:-}
    restart: unless-stopped
    ports:
      - "3002:3002"

  # Single public entry point. Both web apps and both APIs sit behind this
  # on one origin each, so the browser makes same-origin requests and the
  # routing rules live in deploy/nginx/nginx.conf — in this repo, versioned
  # with the code that depends on them.
  #
  # This replaces an nginx installed by hand on the VM, whose config named
  # API endpoints one at a time and so silently stopped routing new ones
  # (a PATCH to /users/me/password reached the Next.js 404 page instead of
  # the API). Stop that host nginx before bringing this up, or it will hold
  # port 8081:  sudo systemctl disable --now nginx
  #
  #   office: http://<host>:8081     vessel: http://<host>:8082
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8081:8081"
      - "8082:8082"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-office
      - api-vessel
      - web-office
      - web-vessel

volumes:
  vessel-db-data:
