# Single public origin for the vessel app — same reasoning as office.conf.
# The vessel bundle calls /trpc, /auth and /system on its own origin.
server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    location /auth/   { proxy_pass http://api-vessel:3003; }
    location /trpc/   { proxy_pass http://api-vessel:3003; }
    location /system/ { proxy_pass http://api-vessel:3003; }
    location /health  { proxy_pass http://api-vessel:3003; }

    location / { proxy_pass http://web-vessel:3002; }

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
}
