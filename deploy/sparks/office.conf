# Single public origin for the office app.
#
# The production web bundle calls /auth, /trpc and /users/me on its own origin
# (apps/web-office/src/lib/api-origin.ts returns '' under NODE_ENV=production),
# so something has to route by path or the browser asks the Next server for API
# routes it does not have. This is that something.
#
# Note /users is BOTH an API collection and a Next page route; only /users/me*
# is called by the browser bundle, so only that prefix goes to the API.
server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    location /auth/    { proxy_pass http://api-office:3001; }
    location /trpc/    { proxy_pass http://api-office:3001; }
    location /users/me { proxy_pass http://api-office:3001; }
    location /health   { proxy_pass http://api-office:3001; }

    location / { proxy_pass http://web-office:3000; }

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
}
