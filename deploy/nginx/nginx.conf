# Single-origin routing for the office and vessel stacks.
#
# This lived only on the deployment host before, hand-written and
# hand-maintained, which is how it drifted out of step with the code: it
# named individual API endpoints (`/users/me` was routed, `/users/me/password`
# was not), so every REST endpoint added since returned the Next.js 404 page
# instead of reaching the API. Keeping it in the repo and shipping it as a
# compose service means the routing changes in the same commit as the code
# that needs it.
#
# Ports, all of which the host nginx served before this moved into compose:
#   8081  office (Node)         8443  vessel (Go binary, still on the host)
#   8444  vessel (Node)
#
# The rules below are deliberately prefix-based and few. Both APIs now mount
# their controllers under /api (setGlobalPrefix in each main.ts), so a new
# controller is reachable the moment it exists — nothing here has to change
# for it. That is the whole point of the prefix: without it /users, /reports
# and /attachments are each simultaneously a Next.js page and an API route,
# which no prefix rule can separate.

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Real client addresses in the logs rather than the compose network's.
  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log  /var/log/nginx/access.log main;
  error_log   /var/log/nginx/error.log warn;

  sendfile      on;
  tcp_nopush    on;
  server_tokens off;

  # Attachments upload in chunks and snapshots download whole; neither fits
  # in nginx's 1 MB default, and the failure is a 413 that looks like a bug
  # in the app.
  client_max_body_size 512m;

  # Backup/snapshot downloads and schema publishes can outlast the 60s
  # default, and proxy_buffering off keeps a large download streaming
  # rather than spooling to disk first.
  proxy_read_timeout    300s;
  proxy_send_timeout    300s;
  proxy_request_buffering off;

  # Docker's embedded DNS. Needed because the proxy_pass targets below are
  # built from variables, which makes nginx resolve them per request instead
  # of once at startup — without it, redeploying api-office gives it a new
  # container IP and nginx serves 502 against the old one until nginx itself
  # is restarted.
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_set_header Upgrade           $http_upgrade;
  proxy_set_header Connection        $connection_upgrade;

  # ---------------------------------------------------------------- office
  server {
    listen 8081;
    server_name _;

    # Every REST controller in api-office.
    location /api/ {
      set $office_api http://api-office:3001;
      proxy_pass $office_api$request_uri;
    }

    # tRPC is mounted as middleware rather than a controller, so
    # setGlobalPrefix does not move it and it keeps its own top-level
    # path. It is a fixed, closed set of routes — unlike the controllers,
    # it does not grow. SuperTokens needs no rule of its own: its
    # apiBasePath is /api/auth, so the block above already covers it.
    location /trpc/ {
      set $office_trpc http://api-office:3001;
      proxy_pass $office_trpc$request_uri;
    }

    # Everything else is the Next.js app, including /users and /reports,
    # which are pages here and API routes above only under /api.
    location / {
      set $office_web http://web-office:3000;
      proxy_pass $office_web$request_uri;
    }
  }

  # ---------------------------------------------------- vessel (Go, legacy)
  # The Go vessel binary still runs natively on this host under systemd
  # (ovl-vessel, 127.0.0.1:8420) and was reachable on 8443 through the
  # host's own nginx. Moving that nginx into a container took the port with
  # it, so this block keeps 8443 answering exactly as before. Retire it when
  # the Node vessel below takes over for real.
  server {
    listen 8443;
    server_name _;

    location / {
      # Literal target, not the `set`-a-variable form used for the compose
      # services above. That form makes nginx re-resolve per request through
      # the `resolver` directive — Docker's embedded DNS — which knows
      # compose service names and nothing else. host.docker.internal comes
      # from /etc/hosts via the service's extra_hosts mapping, so a resolver
      # lookup fails it with "Host not found" even though the container can
      # reach the address perfectly well. A literal is resolved once at
      # startup from /etc/hosts, which is what this needs; the host gateway
      # has no reason to change under us the way a container IP does.
      proxy_pass http://host.docker.internal:8420;
    }
  }

  # -------------------------------------------------------- vessel (Node)
  # 8444, the port the host nginx used, so existing links keep working.
  #
  # That config needed four rules here — /trpc, /auth/, /system/backup and a
  # regex for ^/reports/[^/]+/attachments, the regex specifically because
  # web-vessel has its own /reports pages that a plain prefix would swallow.
  # All three API routes now live under /api (setGlobalPrefix in
  # api-vessel/src/main.ts), so they collapse into one rule and the regex is
  # gone: the collision it worked around no longer exists.
  server {
    listen 8444;
    server_name _;

    location /api/ {
      set $vessel_api http://api-vessel:3003;
      proxy_pass $vessel_api$request_uri;
    }

    location /trpc/ {
      set $vessel_trpc http://api-vessel:3003;
      proxy_pass $vessel_trpc$request_uri;
    }

    location / {
      set $vessel_web http://web-vessel:3002;
      proxy_pass $vessel_web$request_uri;
    }
  }
}
